name: Product verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: telemetry
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: telemetry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U telemetry -d telemetry_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://telemetry:synthetic-test-only@127.0.0.1:5432/telemetry_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - run: python3 -m unittest discover -s tests -v
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build:public-site
      - run: npx playwright install --with-deps chromium
      - name: Start isolated synthetic server
        run: |
          go build -o /tmp/team-server ./cmd/team-server
          DATABASE_URL="$TEST_DATABASE_URL" /tmp/team-server --demo --listen 127.0.0.1:18090 > /tmp/team-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18090/healthz; then exit 0; fi
            sleep 1
          done
          cat /tmp/team-server.log
          exit 1
      - run: npm run test:ui
      - run: docker build -f deploy/Dockerfile -t shared-account-monitor:test .
      - run: docker build -f public-site/Dockerfile -t shared-account-public-site:test .
      - name: Test standalone public website and docs
        run: |
          docker run -d --name shared-account-public-site-test -p 127.0.0.1:18093:8080 shared-account-public-site:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18093/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18093/docs/guide/getting-started >/dev/null
          npm run test:public-site
  companion:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./cmd/team-agent ./cmd/team-mcp
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
