services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - archive:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U telemetry -d telemetry]
      interval: 10s
      timeout: 5s
      retries: 6
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://telemetry:${POSTGRES_PASSWORD}@db:5432/telemetry?sslmode=disable
      VIEWER_ENCRYPTION_KEY: ${VIEWER_ENCRYPTION_KEY:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the HTTPS origin}
      TEAM_WORKSPACE: ${TEAM_WORKSPACE:-team}
      AUTH_MODE: ${AUTH_MODE:-password}
      OWNER_EMAIL: ${OWNER_EMAIL:?Set the owner email}
      OWNER_SETUP_TOKEN: ${OWNER_SETUP_TOKEN:-}
      OWNER_SETUP_FILE: /run/setup/owner-link.txt
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OWNER_OIDC_SUBJECT: ${OWNER_OIDC_SUBJECT:-}
      INITIAL_POLICY: ${INITIAL_POLICY:?Set an explicit initial policy}
    tmpfs:
      - /run/setup:uid=65532,gid=65532,mode=0700
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  archive:
